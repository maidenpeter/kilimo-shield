[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agroshield"
version = "0.1.0"
description = "AgroShield: parametric maize insurance pricing, triggers and payouts for Kenyan smallholders"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "pydantic>=2.5",
  "matplotlib>=3.8",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agroshield-price = "agroshield_pricing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agroshield_pricing = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
