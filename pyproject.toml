[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agroshield"
version = "0.1.0"
description = "AgroShield: parametric maize insurance pricing, triggers and payouts for Kenyan smallholders"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "pydantic>=2.5",
  "matplotlib>=3.8",
  "jinja2>=3.1",
  "fastapi>=0.115,<0.116",
  "starlette>=0.37.2,<0.39",   # the range fastapi 0.115 supports
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "cryptography>=42",
  "itsdangerous>=2.1",      # signed session cookies
  "python-multipart>=0.0.9",  # form and file uploads
  "httpx>=0.27",
  "pypdf>=4",               # text from KMD advisory PDFs for reviewers             # M-Pesa Daraja and Africa's Talking clients
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Only for downloading CHIRPS v3.0 (fetch-rainfall --dataset chirps3, live monitoring of
# seasons from 2027); reading the committed cache needs neither.
chirps3 = ["h5py>=3.10", "requests>=2.31"]

[project.scripts]
agroshield-price = "agroshield_pricing.cli:main"
agroshield-api = "agroshield_pricing.api:main"
agroshield-portal = "agroshield_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agroshield_pricing = ["templates/*.html"]
agroshield_platform = ["articles.json", "web/templates/*.html", "web/templates/public/*.html", "web/static/*",
                       "web/static/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
