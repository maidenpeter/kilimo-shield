[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agroshield"
version = "0.1.0"
description = "AgroShield: parametric maize insurance pricing, triggers and payouts for Kenyan smallholders"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "pydantic>=2.5",
  "matplotlib>=3.8",
  "jinja2>=3.1",
  "fastapi>=0.115,<0.116",
  "starlette>=0.37.2,<0.39",   # the range fastapi 0.115 supports
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",           # database migrations (src/agroshield_platform/migrations)
  "pillow>=10",              # photo app: EXIF stripping, perceptual hashes
  "anthropic>=2.0",          # photo app: reviewer suggestions only (never pricing, triggers or payouts)
  "cryptography>=42",
  "itsdangerous>=2.1",      # signed session cookies
  "python-multipart>=0.0.9",  # form and file uploads
  "httpx>=0.27",
  "pypdf>=4",               # text from KMD advisory PDFs for reviewers             # M-Pesa Daraja and Africa's Talking clients
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agroshield-price = "agroshield_pricing.cli:main"
agroshield-api = "agroshield_pricing.api:main"
agroshield-portal = "agroshield_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agroshield_pricing = ["templates/*.html"]
agroshield_platform = ["articles.json", "web/templates/*.html", "web/templates/public/*.html", "web/static/*",
                       "web/static/*/*", "web/templates/app/*.html", "migrations/*.py", "migrations/script.py.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
