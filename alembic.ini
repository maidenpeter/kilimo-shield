# Alembic for the AgroShield portal database. The portal applies revisions itself on start
# (agroshield_platform.migrate); use this for hand work, e.g. from the repo root:
#   .venv/Scripts/alembic current
#   .venv/Scripts/alembic revision --autogenerate -m "what changed"
#   .venv/Scripts/alembic upgrade head
# The database URL comes from DATABASE_URL (or .env), defaulting to var/agroshield.db.

[alembic]
script_location = %(here)s/src/agroshield_platform/migrations
prepend_sys_path = %(here)s/src
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
