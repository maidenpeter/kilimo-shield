<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Before and After</title>
<style>
:root { color-scheme: light; --bg:#f4f6f5; --ink:#0a201b; --ink2:#4c685f; --card:#fff; --line:#d9e2df; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg:#0b1512; --ink:#e0f2f1; --ink2:#9fbdb6; --card:#12201c; --line:#24403a; } }
:root[data-theme="dark"] { color-scheme: dark; --bg:#0b1512; --ink:#e0f2f1; --ink2:#9fbdb6; --card:#12201c; --line:#24403a; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
main { max-width:1200px; margin:0 auto; padding:24px 16px 64px; }
h2 { margin:32px 0 8px; border-top:1px solid var(--line); padding-top:12px; }
.pair { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; align-items:start; }
figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px; }
figcaption { color:var(--ink2); font-size:.85rem; margin-bottom:6px; font-weight:600; }
img { width:100%; height:auto; border-radius:6px; display:block; }
.phone img { max-width:375px; }
</style></head>
<body><main>
<h1>SACCO portal: before and after (milestone 6b)</h1>
<p>Before: milestone 6, signed in as the demo manager. After: signed in as the demo officer. Fictional demo data.</p>

<h2>Home, desktop</h2>
<div class="pair"><figure><figcaption>Before</figcaption><img src="before-home-desktop.png" alt="Before: dashboard on desktop"></figure>
<figure><figcaption>After</figcaption><img src="after-home-desktop.png" alt="After: officer Home on desktop"></figure></div>
<h2>Home, 375 px</h2>
<div class="pair phone"><figure><figcaption>Before</figcaption><img src="before-home-375.png" alt="Before: dashboard at 375 px"></figure>
<figure><figcaption>After</figcaption><img src="after-home-375.png" alt="After: officer Home at 375 px"></figure>
<figure><figcaption>After: menu open</figcaption><img src="after-home-375-menu.png" alt="After: phone menu open"></figure></div>

<h2>Enrol, desktop</h2>
<div class="pair"><figure><figcaption>Before: one long form</figcaption><img src="before-enrol-desktop.png" alt="Before: enrolment form on desktop"></figure>
<figure><figcaption>After: step 1 of 5</figcaption><img src="after-enrol-1-desktop.png" alt="After: enrolment step 1 on desktop"></figure></div>
<h2>Enrol, 375 px: all five screens</h2>
<div class="pair phone"><figure><figcaption>Before (full page)</figcaption><img src="before-enrol-375.png" alt="Before: enrolment form at 375 px"></figure>
<figure><figcaption>After: 1 Farmer</figcaption><img src="after-enrol-1-375.png" alt="Step 1"></figure>
<figure><figcaption>After: 2 Farm</figcaption><img src="after-enrol-2-375.png" alt="Step 2"></figure>
<figure><figcaption>After: 3 Agreement</figcaption><img src="after-enrol-3-375.png" alt="Step 3"></figure>
<figure><figcaption>After: 4 Price and payment</figcaption><img src="after-enrol-4-375.png" alt="Step 4"></figure>
<figure><figcaption>After: 5 Done</figcaption><img src="after-enrol-5-375.png" alt="Step 5"></figure></div>

<h2>Price answer, desktop</h2>
<div class="pair"><figure><figcaption>Before: quote page</figcaption><img src="before-price-desktop.png" alt="Before: quote on desktop"></figure>
<figure><figcaption>After: one sentence first</figcaption><img src="after-price-desktop.png" alt="After: price answer on desktop"></figure>
<figure><figcaption>After: Details open</figcaption><img src="after-price-details-desktop.png" alt="After: price Details on desktop"></figure></div>
<h2>Price answer, 375 px</h2>
<div class="pair phone"><figure><figcaption>Before</figcaption><img src="before-price-375.png" alt="Before: quote at 375 px"></figure>
<figure><figcaption>After</figcaption><img src="after-price-375.png" alt="After: price answer at 375 px"></figure>
<figure><figcaption>After: Details open</figcaption><img src="after-price-details-375.png" alt="After: price Details at 375 px"></figure></div>
</main></body></html>
