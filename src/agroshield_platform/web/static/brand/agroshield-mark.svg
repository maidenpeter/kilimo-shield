<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AgroShield">
  <title>AgroShield mark</title>
  <!-- Faceted shield in the NuruOps emblem style: teal facets, one gold facet (sunrise over the field). -->
  <g stroke="#0F1117" stroke-opacity="0.35" stroke-width="0.7" stroke-linejoin="round">
    <polygon points="32,4 9,12 32,30" fill="#4DB6AC"/>
    <polygon points="32,4 32,30 55,12" fill="#E8960C"/>
    <polygon points="9,12 9,32 32,30" fill="#00897B"/>
    <polygon points="55,12 32,30 55,32" fill="#00796B"/>
    <polygon points="9,32 32,60 32,30" fill="#00695C"/>
    <polygon points="55,32 32,30 32,60" fill="#004D40"/>
  </g>
</svg>
