# Kiswahili strings for USSD menus and SMS. Same keys and placeholders as en.yaml.
# Fixed from the old demo: its askIrrigation line asked about electricity
# ("kwa umeme") and askSubCounty dropped the ward; neither is reused.
# ILLUSTRATIVE: PENDING NATIVE-SPEAKER (KISWAHILI) AND LEGAL REVIEW before any
# farmer sees it. Rules as en.yaml (GSM-7, SMS <= 160, USSD <= 182).
language: sw
review_status: pending legal and Kiswahili review

season:
  LR: "masika {year}"
  SR: "vuli {year}"

status:
  pending_payment: "inasubiri malipo"
  active: "inatumika"
  lapsed_unpaid: "haikuanza (malipo hayakukamilika)"
  cancelled: "imefutwa"

