# Kiswahili strings for USSD menus and SMS. Same keys and placeholders as en.yaml.
# Fixed from the old demo: its askIrrigation line asked about electricity
# ("kwa umeme") and askSubCounty dropped the ward; neither is reused.
# ILLUSTRATIVE: PENDING NATIVE-SPEAKER (KISWAHILI) AND LEGAL REVIEW before any
# farmer sees it. Rules as en.yaml (GSM-7, SMS <= 160, USSD <= 182).
language: sw
review_status: pending legal and Kiswahili review

season:
  LR: "masika {year}"
  SR: "vuli {year}"

status:
  pending_payment: "inasubiri malipo"
  active: "inatumika"
  lapsed_unpaid: "haikuanza (malipo hayakukamilika)"
  cancelled: "imefutwa"

ussd:
  not_registered: "Nambari hii haijasajiliwa na AgroShield. Tafadhali tembelea SACCO yako ujisajili."
  main: "Habari {first_name}! AgroShield\n1. Bima yangu\n2. Lipa ada\n3. Malipo ya bima\n4. Lugha / Language\n0. Msaada"
  no_policy: "Bado huna bima ya AgroShield. Tafadhali tembelea SACCO yako."
  cover: "{cert}\n{season}, ekari {acres}\nHali: {status}\nUmelipa KES {paid} kati ya KES {due}"
  cover_due: "\nLipa kabla ya {closes}"
  cover_refund: "\nUtarudishiwa: KES {refund}"
  nothing_due: "Hakuna deni kwa {cert}. Hali: {status}."
  sales_closed: "Mauzo ya {season} yalifungwa {closes}. SACCO yako itakueleza kuhusu msimu ujao."
  pay_menu: "Lipia {cert}\nSalio KES {balance}\n1. Lipa salio lote\n2. Lipa sehemu (awamu)"
  pay_amount: "Weka kiasi kwa KES ({min} hadi {balance}):"
  bad_amount: "Kiasi kiwe nambari kamili kati ya {min} na {balance}. Tafadhali jaribu tena."
  stk_sent: "Ombi la M-Pesa la KES {amount} limetumwa kwa simu yako. Weka PIN yako ya M-Pesa kulipa. Tutakutumia SMS."
  stk_failed: "M-Pesa haipatikani sasa. Tafadhali jaribu baadaye au lipa kupitia SACCO yako."
  payouts: "Ufuatiliaji wa malipo kwa wadi yako bado haujaanza. SACCO yako itakujulisha ukianza."
  language_menu: "Chagua lugha / Choose language\n1. English\n2. Kiswahili"
  language_set: "Lugha imewekwa Kiswahili."
  help: "Kwa msaada, wasiliana na SACCO yako: {sacco}. Bima hulipa kwa kipimo cha mvua cha wadi yako, si ukaguzi wa shamba."
  invalid: "Chaguo si sahihi. Tafadhali piga tena."

sms:
  enrolled: "AgroShield: {first_name}, umesajiliwa bima ya mahindi {season}, {cert}. Lipa KES {due} kufikia {closes} (M-Pesa/SACCO). Piga {ussd}."
  payment_received: "AgroShield: tumepokea KES {amount} kwa {cert}. Umelipa KES {paid} kati ya {due}. Salio KES {balance}, lipa kabla ya {closes}."
  cover_active: "AgroShield: ada imelipwa yote. Bima yako ya mahindi {season} {cert} sasa inatumika. Malipo hufuata kipimo cha mvua cha wadi yako."
  reminder: "AgroShield: KES {balance} bado inadaiwa kwa {cert}. Lipa kabla ya {closes} la sivyo bima haitaanza. Piga {ussd} kulipa."
  lapsed: "AgroShield: {cert} haikulipwa yote kufikia {closes}, kwa hivyo bima haikuanza. KES {paid} utarudishiwa kupitia SACCO yako."
  late_payment: "AgroShield: KES {amount} imepokelewa kwa {cert} baada ya mauzo kufungwa {closes}. Bima haikuanza. Utarudishiwa kupitia SACCO."
  overpaid: "AgroShield: umelipa KES {refund} zaidi ya deni kwa {cert}. Utarudishiwa kupitia SACCO yako."
