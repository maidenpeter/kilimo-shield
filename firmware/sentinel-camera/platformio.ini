; AgroShield sentinel field camera (AI-Thinker ESP32-CAM, OV2640).
;
; Wakes on a schedule, takes 1 to 3 photos a day, queues each JPEG on the SD card, uploads the queue to the
; AgroShield device ingestion endpoint (store and forward), then deep-sleeps.
;
; Build:   pio run -e esp32cam          (GSM uplink, SIM800L through TinyGSM)
;          pio run -e esp32cam-wifi     (Wi-Fi uplink, for sites with a school or SACCO office network)
; Settings: include/config.h (defaults) and include/secrets.h (per device, not committed; copy secrets.example.h).

[platformio]
default_envs = esp32cam

[env]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
; The camera needs PSRAM; "huge_app" leaves room for both uplinks and TLS.
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1

[env:esp32cam]
build_flags =
    ${env.build_flags}
    -DUPLINK_GSM=1
    -DTINY_GSM_MODEM_SIM800
lib_deps =
    vshymanskyy/TinyGSM@0.12.0
    arduino-libraries/ArduinoHttpClient@0.6.1

[env:esp32cam-wifi]
build_flags =
    ${env.build_flags}
    -DUPLINK_WIFI=1
; ArduinoHttpClient's HttpClient.h would shadow the core's HTTPClient.h on case-insensitive file systems.
lib_ignore =
    ArduinoHttpClient
    TinyGSM
