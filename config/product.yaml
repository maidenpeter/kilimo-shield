# Product terms: Layer B index, premium build-up, targets and tests.
# Every number here is ILLUSTRATIVE until the underwriter and IRA filing fix it.
illustrative: true

# ---------------------------------------------------------------------------
# Layer B v1: seasonal Water Requirement Satisfaction Index (WRSI).
# FAO / FEWS NET dekadal water balance on CHIRPS rainfall, with a dynamic
# start of season. One index value per ward and season.
# ---------------------------------------------------------------------------
layer_b:
  # Bump on any change to the index definition or its terms. Recorded in every
  # run manifest so a historical payout can be traced to the exact rules.
  version: "B-1.0.0"

  # FEWS NET maize crop coefficients at % of the length of growing period,
  # linearly interpolated to each dekad's midpoint.
  kc:
    points_pct: [0, 16, 44, 76, 100]
    values:     [0.30, 0.30, 1.20, 1.20, 0.35]

  # Actual ET equals the crop requirement while soil water stays above
  # (1 - p) x capacity, then falls linearly to zero (FAO-56; maize p = 0.55).
  depletion_fraction: 0.55

  # Dekads of bare-soil water balance before the start of season, so pre-season
  # rain is already in the soil when the crop starts (soil starts empty).
  spinup_dekads: 3

  # Start of season: the first dekad in the ward's planting window with at
  # least first_dekad_mm, followed by at least next_two_dekads_mm over the next
  # two dekads (FEWS NET rule).
  onset: {first_dekad_mm: 25, next_two_dekads_mm: 20}

  # No onset by the end of the planting window: fixed payout, share of sum
  # insured. Placeholder; links to the Layer A anticipatory cover later.
  failed_onset_payout: 0.25

  # Payout is 0 at or above the trigger, linear down to the exit, full at or
  # below the exit. WRSI 50 = crop failure (FEWS NET).
  trigger_wrsi: 80
  exit_wrsi: 50

  # Triggers re-priced in the report's sensitivity table (WRSI points).
  sensitivity_triggers: [65, 70, 75, 80, 85, 90]
  # Soil water holding capacities re-run in the report while ward soil data is
  # a placeholder (mm).
  sensitivity_whc_mm: [60, 100, 140, 180]

  # Optional per-ward, per-season terms, e.g.
  # overrides:
  #   ward-b:
  #     LR: {trigger_wrsi: 90}
  overrides: {}

# Target payout frequency: about one season in 5 to 7.
# [ASK] placeholder, underwriter to confirm.
target:
  payout_return_period_years: [5, 7]

# Known events the index must catch. A run reports PASS/FAIL for each.
event_tests:
  - {year: 1984, season: LR, min_payout: 0.5, note: "1984 drought, the worst season on record in Kenya"}

# ---------------------------------------------------------------------------
# Layer B v0 (SUPERSEDED): per-phase rainfall percentile index. Kept only to
# show alongside v1 in the report; it does not price anything.
# ---------------------------------------------------------------------------
layer_b_v0:
  version: "B-0.1.0"
  daily_min_mm: 1.0
  daily_cap_mm: 60.0
  phases:
    germination: {weight: 0.30, trigger: {percentile: 10}, exit: {percentile: 2}}
    vegetative:  {weight: 0.10, trigger: {percentile: 10}, exit: {percentile: 2}}
    flowering:   {weight: 0.40, trigger: {percentile: 10}, exit: {percentile: 2}}
    grain_fill:  {weight: 0.20, trigger: {percentile: 10}, exit: {percentile: 2}}
  calibration: {start_year: 1981, end_year: 2025}
  overrides: {}

# ---------------------------------------------------------------------------
# Sum insured and gross premium build-up.
# ---------------------------------------------------------------------------
sum_insured:
  # KES per acre. Placeholder options pending input-cost data from the SACCO.
  options_kes_per_acre: [5000, 10000, 15000]
  default_kes_per_acre: 10000

premium:
  # Risk margin on top of the expected loss. Methods:
  #   std_dev: factor x standard deviation of the annual loss
  #   tail:    factor x (loss at `percentile`) - expected loss
  risk_margin: {method: std_dev, factor: 0.25}

  # Loadings as shares of the GROSS premium, so
  #   gross = (expected loss + risk margin) / (1 - sum of loadings).
  # [ASK] underwriter's required loadings and margin.
  loadings:
    expense: 0.12
    intermediary: 0.05        # SACCO distribution fee
    platform: 0.06            # AgroShield technology and pricing fee
    underwriter_margin: 0.07

# ---------------------------------------------------------------------------
# Yield backtest, used once real ward yield history is available [ASK].
# Until then basis risk is reported as not measurable.
# ---------------------------------------------------------------------------
backtest:
  # A season counts as "bad" below this share of the ward's median yield.
  bad_yield_threshold: 0.75
  # Payouts below this share of sum insured count as "no payout" when scoring
  # basis risk (a token payout does not cover a failed crop).
  meaningful_payout: 0.05
