# Product terms: Layer B index, premium build-up, targets and tests.
# Every number here is ILLUSTRATIVE until the underwriter and IRA filing fix it.
illustrative: true

# ---------------------------------------------------------------------------
# Layer B v1: seasonal Water Requirement Satisfaction Index (WRSI).
# FAO / FEWS NET dekadal water balance on CHIRPS rainfall, with a dynamic
# start of season. One index value per ward and season.
# ---------------------------------------------------------------------------
layer_b:
  # Bump on any change to the index definition or its terms. Recorded in every
  # run manifest so a historical payout can be traced to the exact rules.
  version: "B-1.2.0"

  # FEWS NET maize crop coefficients at % of the length of growing period,
  # linearly interpolated to each dekad's midpoint.
  kc:
    points_pct: [0, 16, 44, 76, 100]
    values:     [0.30, 0.30, 1.20, 1.20, 0.35]

  # Actual ET equals the crop requirement while soil water stays above
  # (1 - p) x capacity, then falls linearly to zero (FAO-56; maize p = 0.55).
  depletion_fraction: 0.55

  # Dekads of bare-soil water balance before the start of season, so pre-season
  # rain is already in the soil when the crop starts (soil starts empty).
  spinup_dekads: 3

  # Planting rain: the first dekad with at least this much rain, searched from
  # the ward's planting_rain_from date (phenology.yaml) to the end of its
  # planting window, starts the season.
  planting_rain_mm: 25

  # Trigger (a): failed onset. CATASTROPHE-ONLY cover (decision 2026-10-28:
  # keep at 80 mm, do not raise it to make it fire). Total rain over the WHOLE
  # planting window below the threshold means the season never started: fixed
  # payout (share of sum insured), no WRSI season. Links to Layer A later.
  failed_onset:
    window_rain_below_mm: 80
    payout: 0.25

  # Trigger (b): germination dry spell. After a planting rain, less than
  # rain_below_mm over the next days_after_planting days: pays the replanting
  # cost as a SEED VOUCHER (KES per acre), at most once per season, and the WRSI
  # season restarts from the next planting rain (searched up to
  # restart_search_extra_dekads past the window). If no planting rain is found,
  # the season starts at the end of the window.
  # ILLUSTRATIVE: KES 2,500 until agro-dealer quotes for certified seed per acre.
  germination_dry_spell:
    days_after_planting: 20
    rain_below_mm: 20
    replant_cost_kes_per_acre: 2500
    restart_search_extra_dekads: 3

  # Payout is 0 at or above the trigger, linear down to the exit, full at or
  # below the exit. WRSI 50 = crop failure (FEWS NET).
  trigger_wrsi: 80
  exit_wrsi: 50

  # Triggers re-priced in the report's sensitivity table (WRSI points).
  sensitivity_triggers: [65, 70, 75, 80, 85, 90]
  # Soil water holding capacities re-run in the report while ward soil data is
  # a placeholder (mm).
  sensitivity_whc_mm: [60, 100, 140, 180]

  # Flowering dry-spell component: DROPPED FROM v1 (decision 2026-10-28).
  # CHIRPS daily values are disaggregated from pentads, so dry-spell lengths are
  # unreliable. The code is kept, switched off; it needs station rainfall
  # (e.g. TAHMO) before it is reconsidered. Do not enable it on CHIRPS.
  #   longest_dry_spell: longest run of days below dry_day_mm
  #   rainfall_deficit:  % shortfall of window rain against Kc x PET
  flowering:
    enabled: false
    window_pct_of_lgp: [45, 65]
    metric: longest_dry_spell
    dry_day_mm: 2.0
    trigger: 12
    exit: 25
    max_payout: 0.30

  # EXPERIMENTAL early ADVANCE on Layer B (decision 2026-10-29). At day
  # check_day_after_sos after the start of season, project the end-of-season WRSI
  # from observed CHIRPS so far, the CHIRPS-GEFS 15-day forecast and climatology
  # after that. Below projected_wrsi_below, pay advance_share of the sum insured.
  # The advance is deducted from the end-of-season Layer B payout and NEVER clawed
  # back, so the farmer receives max(advance, final payout). Only the net extra
  # cost (advance above the final payout, including false alarms) is priced.
  # Not in quotes until approved; not offered at Ward B.
  # See docs/research/advance-and-short-rains.html.
  advance:
    status: experimental
    included_in_quotes: false
    offered_wards: [ward-a]
    check_day_after_sos: 35
    projected_wrsi_below: 95
    advance_share: 0.20
    forecast: "CHIRPS-GEFS v12 15-day mean"
    validation_years: [2000, 2025]
    # Thresholds a leave-one-out fold may choose from when validating 95.
    threshold_grid: [80, 82.5, 85, 87.5, 90, 92.5, 95, 97.5, 99]

  # Optional per-ward, per-season terms, e.g.
  # overrides:
  #   ward-b:
  #     LR: {trigger_wrsi: 90}
  overrides: {}

# Target payout frequencies, as "one season in N years". [ASK] placeholders,
# underwriter to confirm.
#   main:       WRSI and failed-onset payouts (per ward)
#   replanting: germination dry-spell seed vouchers, a separate target
# The combined frequency (any payout) is reported for farmer communication.
target:
  payout_return_period_years: [5, 7]
  ward_overrides:
    ward-b: [8, 12]       # wetter highland: drought payouts should be rarer
  replant_return_period_years: [8, 12]

# Known events. At wards in required_for the payout must reach min_payout
# (PASS/FAIL); everywhere else the event is reported only.
event_tests:
  - {year: 1984, season: LR, min_payout: 0.5, required_for: [ward-a],
     note: "1984 drought, the worst season on record in Kenya"}

# ---------------------------------------------------------------------------
# Layer A: anticipatory seed voucher, triggered by the pre-season forecast.
# Before planting, if the seasonal outlook for the ward is bad enough, insured
# farmers get a voucher for drought-tolerant certified seed through their SACCO.
# ---------------------------------------------------------------------------
layer_a:
  version: "A-0.1.0"
  # DROPPED FROM THE PRODUCT (decision 2026-10-29). The code is kept, switched
  # off: nothing is priced, quoted or sold. Measured C3S MAM skill caught 2 of 11
  # Layer B payout seasons with a 67% false alarm ratio.
  enabled: false
  disabled_reason: >-
    Dropped from the product (2026-10-29): measured C3S March-May forecast skill
    caught 2 of 11 Layer B payout seasons with a 67% false alarm ratio.
  # Wards where Layer A is offered. Ward B: not offered (decision 2026-10-28),
  # because a dry March-May there rarely becomes a crop failure.
  offered_wards: [ward-a]
  # What the forecast predicts: total ward rainfall (CHIRPS) over these months,
  # and when it is issued (before the planting window opens).
  forecast_months: {LR: [3, 4, 5]}
  issue_month: {LR: 2}
  # Voucher issued when P(below-normal rainfall) is at or above this.
  trigger_prob_below_normal: 0.45
  # Fixed voucher per acre (drought-tolerant certified seed). Placeholder pending
  # agro-dealer prices.
  voucher_kes_per_acre: 2000
  sensitivity_thresholds: [0.35, 0.40, 0.45, 0.50, 0.55, 0.60]

# SYNTHETIC seasonal forecast with MEASURED skill. It is generated from the
# observed rainfall with the correlation the real C3S hindcast achieved, so it
# prices what a forecast of that skill would cost and catch over 1981-2025; it is
# not a forecast. Operationally, Layer A would trigger on the real outlook.
synthetic_forecast:
  # Measured (research 3b, 2026-10-28): C3S ECMWF SEAS5.1 hindcast ensemble-mean
  # correlation with Ward A's CHIRPS March-May rain, 1981-2016, r = 0.33 (95% CI
  # 0.00 to 0.59). Replaces the 0.45 placeholder, which was unrealistic for MAM.
  # GHACOF showed no MAM skill at the wards. See docs/research/3b-forecast-skill.html.
  skill_correlation: {LR: 0.33}
  skill_sweep: [0.0, 0.2, 0.4, 0.6, 0.8]
  draws: 2000                     # Monte Carlo draws of the 45-season history
  seed: 20261028

# ---------------------------------------------------------------------------
# Layer B v0 (SUPERSEDED): per-phase rainfall percentile index. Kept only to
# show alongside v1 in the report; it does not price anything.
# ---------------------------------------------------------------------------
layer_b_v0:
  version: "B-0.1.0"
  daily_min_mm: 1.0
  daily_cap_mm: 60.0
  phases:
    germination: {weight: 0.30, trigger: {percentile: 10}, exit: {percentile: 2}}
    vegetative:  {weight: 0.10, trigger: {percentile: 10}, exit: {percentile: 2}}
    flowering:   {weight: 0.40, trigger: {percentile: 10}, exit: {percentile: 2}}
    grain_fill:  {weight: 0.20, trigger: {percentile: 10}, exit: {percentile: 2}}
  calibration: {start_year: 1981, end_year: 2025}
  overrides: {}

# ---------------------------------------------------------------------------
# Sum insured and gross premium build-up.
# ---------------------------------------------------------------------------
sum_insured:
  # KES per acre. Placeholder options pending input-cost data from the SACCO.
  options_kes_per_acre: [5000, 10000, 15000]
  default_kes_per_acre: 10000

premium:
  # Risk margin on top of the expected loss. Methods:
  #   std_dev: factor x standard deviation of the annual loss
  #   tail:    factor x (loss at `percentile`) - expected loss
  risk_margin: {method: std_dev, factor: 0.25}

  # Loadings as shares of the GROSS premium, so
  #   gross = (expected loss + risk margin) / (1 - sum of loadings).
  # [ASK] underwriter's required loadings and margin.
  loadings:
    expense: 0.12
    intermediary: 0.05        # SACCO distribution fee
    platform: 0.06            # AgroShield technology and pricing fee
    underwriter_margin: 0.07

# ---------------------------------------------------------------------------
# Premium split: government subsidy, then the Resilience discount.
# Both act on who pays, never on the risk price (the gross premium).
# ---------------------------------------------------------------------------
subsidy:
  # Kenya Agricultural Insurance Programme (KAIP) premium subsidy.
  # [ASK] confirm the terms with KAIP and the underwriter.
  illustrative: true
  programme: KAIP
  government_share: 0.50        # share of the gross premium paid by government
  eligible_acres: {min: 0.5, max: 20}   # outside this band: no subsidy
  applies_to_layers: [A, B]
  # Decision 2026-10-29: no subsidy at all outside 0.5-20 acres. Whether KAIP would
  # instead subsidise the first 20 acres of a larger farm is UNCONFIRMED.
  # Subsidy has historically arrived late. While false, every quote and policy
  # carries the government share as "not yet received" (a receivable).
  received: false

resilience:
  # Resilience Score: points from last season's verified practices, turned into
  # a discount on the FARMER'S share of next season's premium, capped.
  # The insurer always receives the FULL gross premium (decision 2026-10-29): the
  # discount is paid by the funder below (platform = out of AgroShield's platform
  # fee; seed_company or sacco = a partner). The discount does not reduce the
  # parametric risk: payouts follow the ward index whatever the farmer does.
  # [ASK] cap and points pending underwriter agreement.
  illustrative: true
  funder: platform              # platform | seed_company | sacco
  discount_per_point: 0.01      # 1% of the farmer share per point
  discount_cap: 0.15
  points:
    - {id: certified_seed_verified, points: 5, label: "Certified seed bought last season", verified_by: "agro-dealer receipt or KIAMIS"}
    - {id: photos_on_schedule, points: 4, label: "Crop photos submitted at every growth stage", verified_by: "photo app (milestone 8)"}
    - {id: practices_verified, points: 3, label: "Good practices verified (timely planting, mulching, conservation tillage)", verified_by: "champion farmer or extension officer"}
    - {id: irrigation_full, points: 3, label: "Full irrigation", verified_by: "officer visit", group: irrigation}
    - {id: irrigation_partial, points: 2, label: "Partial or supplementary irrigation", verified_by: "officer visit", group: irrigation}
    - {id: sacco_good_standing, points: 2, label: "SACCO member in good standing (savings or loan current)", verified_by: "SACCO records"}

# ---------------------------------------------------------------------------
# Yield backtest, used once real ward yield history is available [ASK].
# Until then basis risk is reported as not measurable.
# ---------------------------------------------------------------------------
backtest:
  # A season counts as "bad" below this share of the ward's median yield.
  bad_yield_threshold: 0.75
  # Payouts below this share of sum insured count as "no payout" when scoring
  # basis risk (a token payout does not cover a failed crop).
  meaningful_payout: 0.05
