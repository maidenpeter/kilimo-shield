# Milestone 8: crop photo app (farmers and champion farmers), checks, human review.
# Not part of pricing: this file is not hashed into rate books, and nothing here can change a price,
# a trigger or a payout. Photos inform agronomists, the Resilience Score and the (switched off) picture rider.

storage_dir: var/photos             # stripped JPEGs only (no EXIF, no GPS in the file); location is kept in the database
max_upload_mb: 12
max_side_px: 1600                   # stored size; enough for an agronomist, small on a slow connection

checks:
  max_distance_m: 250               # rejected if taken further than this from the registered plot point
  photo_point_radius_m: 30          # photos within this distance of each other share a photo point (ghost overlay)
  duplicate_hamming: 6              # perceptual hash (64-bit dHash) distance at or below this: same picture
  max_gps_accuracy_m: 100           # flagged if the phone reported a worse fix
  max_clock_skew_hours: 2           # flagged if the camera time (EXIF) and the app time disagree by more
  exif_gps_mismatch_m: 500          # flagged if the camera's own GPS and the app's GPS disagree by more
  max_offline_days: 14              # flagged if taken longer ago than this before it arrived (queued offline too long)

# When each growth stage should be photographed: days after the season's planting date (config/phenology.yaml).
# ILLUSTRATIVE windows for maize, to be agreed with the agronomists.
stages:
  emergence:  {from_day: 7,   to_day: 30,  en: "Seedlings up",         sw: "Miche imeota"}
  vegetative: {from_day: 31,  to_day: 60,  en: "Leafy growth",         sw: "Majani yanakua"}
  tasselling: {from_day: 61,  to_day: 90,  en: "Tassels and silk",     sw: "Maua na nywele za hindi"}
  grain_fill: {from_day: 91,  to_day: 120, en: "Cobs filling",         sw: "Mahindi yanajaa"}
  maturity:   {from_day: 121, to_day: 160, en: "Drying and harvest",   sw: "Kukauka na kuvuna"}

# Resilience Score point "photos_on_schedule" (config/product.yaml): earned for a season when every stage has at
# least one photo taken in its window that passed the checks (not rejected, no fraud flag).
resilience:
  point_id: photos_on_schedule
  stages_needed: 5

# Suggestions for human reviewers only. The reviewer decides; a suggestion never changes a price, trigger or payout.
# Sent only with the farmer's separate consent "photo_ai" (config/consent.yaml), image only, EXIF and GPS stripped,
# no farmer identifiers. With no ANTHROPIC_API_KEY, or if the call fails, the queue works without suggestions.
ai:
  enabled: true
  model: claude-opus-5-5
  max_side_px: 1024                 # the copy sent is smaller than the stored one
  timeout_s: 60

# Picture-based rider: claims-style flow and review structure only. ILLUSTRATIVE pricing, switched OFF in quotes
# until the owner approves. Assessments are labelled illustrative and never create a payout.
rider:
  enabled_in_quotes: false
  label: ILLUSTRATIVE
  rate_of_sum_insured: 0.02         # illustrative premium rate, not filed
  payout_share_by_extent: {none: 0.0, lt25: 0.0, "25_50": 0.25, "50_75": 0.5, gt75: 0.8}
  causes: [drought, pest, disease, flood, hail, other]

app:
  max_pin_attempts: 5
  lockout_minutes: 30
