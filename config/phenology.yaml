# Maize crop calendar per ward and season.
#
# ILLUSTRATIVE: approximate calendars for lowland and highland Nakuru maize,
# pending agronomist sign-off and the real pilot wards.
#
# v1 (WRSI) uses:
#   planting_window    the failed-onset window (all rain in it is totalled) and
#                      the last date a planting rain is searched for
#   planting_rain_from first date a planting rain is searched for. ILLUSTRATIVE:
#                      to be set from what farmers in the ward actually do
#   variety, lgp_days  length of growing period from the start of season
# v0 (superseded per-phase index) uses the fixed planting_date and phases.
# A season that crosses New Year (short rains) is keyed to its planting year.
illustrative: true

wards:
  ward-a:
    LR:
      planting_window: {start: "03-01", end: "04-30"}
      planting_rain_from: "03-01"
      variety: "medium-maturity hybrid"
      lgp_days: 130
      planting_date: "04-01"
      phases:
        - {name: germination, days: 20}
        - {name: vegetative,  days: 35}
        - {name: flowering,   days: 25}
        - {name: grain_fill,  days: 35}
        - {name: maturity,    days: 20}
    # Not offered in the pilot (dropped 2026-10-28); kept so it can be re-added.
    # Early-maturing variety planted at onset, so flowering falls in the November
    # peak rather than the dry January.
    SR:
      planting_window: {start: "09-21", end: "10-31"}
      planting_rain_from: "09-21"
      variety: "early-maturity hybrid"
      lgp_days: 100
      planting_date: "10-01"
      phases:
        - {name: germination, days: 15}
        - {name: vegetative,  days: 30}
        - {name: flowering,   days: 20}
        - {name: grain_fill,  days: 25}
        - {name: maturity,    days: 15}

  ward-b:
    LR:
      planting_window: {start: "03-01", end: "04-30"}
      planting_rain_from: "03-01"
      variety: "late-maturity highland hybrid"
      lgp_days: 180
      planting_date: "03-25"
      phases:
        - {name: germination, days: 25}
        - {name: vegetative,  days: 60}
        - {name: flowering,   days: 30}
        - {name: grain_fill,  days: 45}
        - {name: maturity,    days: 30}
